<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><title>Patient Form — HospitalDB</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/patients.css}"/>
</head>
<body>
<div class="navbar">
    <a class="navbar-logo" href="/">

        <div class="logo-icon">✚</div>

        <span>MediVeda</span>

    </a>
    <div class="breadcrumb">
        <span class="bc-link"><a href="/patients" style="color:#555;text-decoration:none;">Patient</a></span>
        <span class="bc-sep">›</span><span class="bc-cur" th:text="${isNew} ? 'New' : 'Edit'"></span>
    </div>
</div>
<div class="page">
    <a href="/patients" class="back-btn">← Back to Patient</a>

    <div class="form-card">
        <div class="form-title" th:text="${isNew} ? 'New Patient' : 'Edit Patient'"></div>

        <!-- Error alert inside the form card, above the fields -->
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <form th:action="${isNew} ? '/patients' : '/patients/' + ${item['ssn'] ?: item['_selfId']} + '/update'" method="post">
            <div class="form-grid">
                <div class="form-group">
                    <label>SSN</label>
                    <input type="number" name="ssn"
                           th:value="${item['ssn']}"
                           th:readonly="${!isNew}"
                           required/>
                </div>
                <div class="form-group">
                    <label>Insurance ID</label>
                    <input type="number" name="insuranceId"
                           th:value="${item['insuranceId']}"
                           required/>
                </div>
                <div class="form-group full">
                    <label>Name</label>
                    <input type="text" name="name"
                           th:value="${item['name']}"
                           required/>
                </div>
                <div class="form-group full">
                    <label>Address</label>
                    <input type="text" name="address"
                           th:value="${item['address']}"
                           required/>
                </div>
                <div class="form-group">
                    <label>Phone <span style="color:#999;font-size:11px;">(10 digits)</span></label>
                    <input type="tel" name="phone"
                           th:value="${item['phone']}"
                           pattern="[0-9]{10}"
                           maxlength="10"
                           title="Phone number must be exactly 10 digits"
                           placeholder="e.g. 9876543210"
                           required/>
                </div>
                <div class="form-group">
                    <label>Primary Care Physician</label>
                    <select name="pcpId">
                        <option value="">— Select Physician —</option>
                        <option th:each="ph : ${physicians}"
                                th:value="${ph['employeeId']}"
                                th:text="${ph['name']} + ' (ID: ' + ${ph['employeeId']} + ')'"
                                th:selected="${#strings.toString(item['pcpId']) == #strings.toString(ph['employeeId'])}
                             or ${#strings.toString(item['primaryCarePhysicianId']) == #strings.toString(ph['employeeId'])}"
                        >
                        </option>
                    </select>
                </div>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn-primary" th:text="${isNew} ? 'Create Patient' : 'Update Patient'"></button>
                <a href="/patients" class="btn-cancel">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body></html>
