<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/><title>Nurse Form — HospitalDB</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" th:href="@{/css/nurses.css}"/>
</head>
<body>
<div class="navbar">
  <a class="navbar-logo" href="/">

    <div class="logo-icon">✚</div>

    <span>MediVeda</span>

  </a>
  <div class="breadcrumb">
    <span class="bc-link"><a href="/nurses" style="color:#555;text-decoration:none;">Nurse</a></span>
    <span class="bc-sep">›</span><span class="bc-cur" th:text="${isNew} ? 'New' : 'Edit'"></span>
  </div>
</div>
<div class="page">
  <a href="/nurses" class="back-btn">← Back to Nurse</a>
  <div class="form-card">
    <div class="form-title" th:text="${isNew} ? 'New Nurse' : 'Edit Nurse'"></div>

    <!-- Error alert inside the form card -->
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <form th:action="${isNew} ? '/nurses' : '/nurses/' + ${item['employeeId']} + '/update'" method="post">
      <div class="form-grid">
        <div class="form-group">
          <label>Employee ID</label>
          <input type="number" name="employeeId" min="1" th:value="${item['employeeId']}" th:readonly="${!isNew}" required/>
        </div>
        <div class="form-group">
          <label>SSN</label>
          <input type="number" name="ssn"
                 min="1"
                 th:value="${item['ssn']}"
                 th:readonly="${!isNew}"
                 required/>
        </div>
        <div class="form-group full">
          <label>Name</label>
          <input type="text" name="name"
                 pattern="[A-Za-z '.\-]+"
                 title="Only English letters, spaces, hyphens, apostrophes, and periods allowed"
                 th:value="${item['name']}" required/>
        </div>
        <div class="form-group full">
          <label>Position</label>
          <input type="text" name="position"
                 pattern="[A-Za-z '.\-]+"
                 title="Only English letters, spaces, hyphens, apostrophes, and periods allowed"
                 th:value="${item['position']}" required/>
        </div>
        <div class="form-group full">
          <label>Registered</label>
          <select name="registered">
            <option value="true"  th:selected="${item['registered'] == true or item['registered'] == 'true'}">Yes</option>
            <option value="false" th:selected="${item['registered'] == false or item['registered'] == 'false' or item['registered'] == null}">No</option>
          </select>
        </div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn-primary" th:text="${isNew} ? 'Create Nurse' : 'Update Nurse'"></button>
        <a href="/nurses" class="btn-cancel">Cancel</a>
      </div>
    </form>
  </div>
</div>
</body></html>
