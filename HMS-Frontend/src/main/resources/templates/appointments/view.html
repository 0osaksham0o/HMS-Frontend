<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/><title>Appointment Detail — HospitalDB</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" th:href="@{/css/appointments.css}"/>
</head>
<body>
<div class="navbar">
  <a class="navbar-logo" href="/">

    <div class="logo-icon">✚</div>

    <span>MediVeda</span>

  </a>
  <div class="breadcrumb">
    <span class="bc-link"><a href="/appointments" style="color:#555;text-decoration:none;">Appointment</a></span>
    <span class="bc-sep">›</span>
    <span class="bc-cur" th:text="'#' + ${item['appointmentId']}"></span>
  </div>
</div>
<div class="page">
  <a href="/appointments" class="back-btn">← Back to Appointment</a>
  <div class="detail-top">
    <div>
      <div class="detail-title" th:text="'Appointment #' + ${item['appointmentId']}"></div>
      <div class="detail-sub">Appointment</div>
    </div>
    <div class="detail-actions">
      <a class="btn-edit" th:href="@{'/appointments/' + ${item['appointmentId']} + '/edit'}">✏ EDIT</a>
    </div>
  </div>
  <hr class="detail-divider"/>
  <div class="detail-section-title">📋 Appointment Details</div>
  <table class="detail-table">
    <tr><td class="key-cell">APPOINTMENT ID</td><td class="val-cell" th:text="${item['appointmentId']}"></td></tr>
    <tr><td class="key-cell">PATIENT</td>
      <td class="val-cell">
        <span th:if="${item['patientSsn'] != null}">
          <a class="fk-link" th:href="@{'/patients/' + ${item['patientSsn']}}"
             th:text="${item['patientName'] ?: ('Patient #' + item['patientSsn'])}"></a>
        </span>
        <span th:unless="${item['patientSsn'] != null}">—</span>
      </td>
    </tr>
    <tr><td class="key-cell">PHYSICIAN</td>
      <td class="val-cell">
        <span th:if="${item['physicianId'] != null}">
          <a class="fk-link" th:href="@{'/physicians/' + ${item['physicianId']}}"
             th:text="${item['physicianName'] ?: ('Physician #' + item['physicianId'])}"></a>
        </span>
        <span th:unless="${item['physicianId'] != null}">—</span>
      </td>
    </tr>
    <tr><td class="key-cell">PREP NURSE</td>
      <td class="val-cell">
        <span th:if="${item['prepNurseId'] != null}">
          <a class="fk-link" th:href="@{'/nurses/' + ${item['prepNurseId']}}"
             th:text="${item['prepNurseName'] ?: ('Nurse #' + item['prepNurseId'])}"></a>
        </span>
        <span th:unless="${item['prepNurseId'] != null}">—</span>
      </td>
    </tr>
    <tr><td class="key-cell">START</td><td class="val-cell" th:text="${item['start']}"></td></tr>
    <tr><td class="key-cell">END</td><td class="val-cell" th:text="${item['end']}"></td></tr>
    <tr><td class="key-cell">EXAMINATION ROOM</td><td class="val-cell" th:text="${item['examinationRoom']}"></td></tr>
  </table>
</div>
</body></html>
