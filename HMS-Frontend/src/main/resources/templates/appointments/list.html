<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><title>Appointment — HospitalDB</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/appointments.css}"/>
</head>
<body>
<div class="navbar">
    <a class="navbar-logo" href="/">

        <div class="logo-icon">✚</div>

        <span>MediVeda</span>

    </a>
    <div class="breadcrumb">
        <span class="bc-link"><a href="/" style="color:#555;text-decoration:none;">Home</a></span>
        <span class="bc-sep">›</span><span class="bc-cur">Appointment</span>
    </div>
</div>
<div class="page">
    <a href="/" class="back-btn">← Back to Home</a>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}"   class="alert alert-error"   th:text="${error}"></div>
    <div class="tbl-header">
        <div><div class="tbl-title">Appointment</div><div class="tbl-sub">Manage patient appointments.</div></div>
        <a href="/appointments/new" class="btn-primary">+ New Appointment</a>
    </div>
    <div class="data-wrap">
        <table>
            <thead><tr><th>ID</th><th>Patient</th><th>Physician</th><th>Nurse</th><th>Room</th><th>Start</th><th>End</th><th class="right">Actions</th></tr></thead>
            <tbody>
            <tr th:each="item : ${page.items}">
                <th:block th:with="aid=${item['appointmentId']}">
                    <td th:text="${aid}"></td>
                    <td>
                        <span th:if="${item['patientSsn'] != null}" th:text="${item['patientName'] ?: ('Patient #' + item['patientSsn'])}"></span>
                        <span th:unless="${item['patientSsn'] != null}">—</span>
                    </td>
                    <td>
                        <span th:if="${item['physicianId'] != null}" th:text="${item['physicianName'] ?: ('Physician #' + item['physicianId'])}"></span>
                        <span th:unless="${item['physicianId'] != null}">—</span>
                    </td>
                    <td>
                        <span th:if="${item['prepNurseId'] != null}" th:text="${item['prepNurseName'] ?: ('Nurse #' + item['prepNurseId'])}"></span>
                        <span th:unless="${item['prepNurseId'] != null}">—</span>
                    </td>
                    <td th:text="${item['examinationRoom']}"></td>
                    <td th:text="${item['start']}"></td>
                    <td th:text="${item['end']}"></td>
                    <td class="action-cell"><div>
                        <a class="btn-sm" th:href="@{'/appointments/' + ${aid} + '/edit'}">Update</a>
                        <form th:action="@{'/appointments/' + ${aid} + '/delete'}" method="post" style="display:inline">
                            <button class="btn-sm danger" onclick="return confirm('Delete?')">Delete</button>
                        </form>
                    </div></td>
                </th:block>
            </tr>
            <tr th:if="${#lists.isEmpty(page.items)}" class="empty-row"><td colspan="8">No records found.</td></tr>
            </tbody>
        </table>
    </div>
    <div class="pagination">
        <a th:if="${!page.first}" class="btn-page" th:href="@{/appointments(page=${page.prevPage})}">Previous</a>
        <span th:if="${page.first}" class="btn-page disabled">Previous</span>
        <a th:if="${!page.last}"  class="btn-page" th:href="@{/appointments(page=${page.nextPage})}">Next</a>
        <span th:if="${page.last}"  class="btn-page disabled">Next</span>
    </div>
</div>
</body></html>
