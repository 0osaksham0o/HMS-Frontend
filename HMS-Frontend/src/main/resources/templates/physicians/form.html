<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/><title>Physician Form — HospitalDB</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" th:href="@{/css/physicians.css}"/>
</head>
<body>
<div class="navbar">
  <a class="navbar-logo" href="/">

    <div class="logo-icon">✚</div>

    <span>MediVeda</span>

  </a>
  <div class="breadcrumb">
    <span class="bc-link"><a href="/" style="color:#555;text-decoration:none;">Home</a></span>
    <span class="bc-sep">›</span>
    <span class="bc-link"><a href="/physicians" style="color:#555;text-decoration:none;">Physician</a></span>
    <span class="bc-sep">›</span>
    <span class="bc-cur" th:text="${isNew} ? 'New' : 'Edit'"></span>
  </div>
</div>

<div class="page">
  <a href="/physicians" class="back-btn">← Back to Physician</a>

  <div class="form-card">
    <div class="form-title" th:text="${isNew} ? 'New Physician' : 'Edit Physician'"></div>

    <!-- Error alert inside the form card, above the fields -->
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <form th:action="${isNew} ? '/physicians' : '/physicians/' + ${item['employeeId']} + '/update'" method="post">
      <div class="form-grid">
        <div class="form-group">
          <label>Employee ID</label>
          <input type="number" name="employeeId"
                 th:value="${item['employeeId']}"
                 th:readonly="${!isNew}" required/>
        </div>
        <div class="form-group">
          <label>SSN</label>
          <input type="number" name="ssn"
                 th:value="${item['ssn']}"
                 th:readonly="${!isNew}"
                 required/>
        </div>
        <div class="form-group full">
          <label>Name</label>
          <input type="text" name="name"
                 th:value="${item['name']}"
                 required/>
        </div>
        <div class="form-group full">
          <label>Position</label>
          <input type="text" name="position"
                 th:value="${item['position']}"
                 required/>
        </div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn-primary" th:text="${isNew} ? 'Create Physician' : 'Update Physician'"></button>
        <a href="/physicians" class="btn-cancel">Cancel</a>
      </div>
    </form>
  </div>
</div>
</body></html>
