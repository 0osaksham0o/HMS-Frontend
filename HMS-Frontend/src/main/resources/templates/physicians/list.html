<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/><title>Physician — HospitalDB</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" th:href="@{/css/physicians.css}"/>
</head>
<body>
<div class="navbar">
  <a class="navbar-logo" href="/">

    <div class="logo-icon">✚</div>

    <span>MediVeda</span>

  </a>
  <div class="breadcrumb">
    <span class="bc-link"><a href="/" style="color:#555;text-decoration:none;">Home</a></span>
    <span class="bc-sep">›</span>
    <span class="bc-cur">Physician</span>
  </div>
</div>

<div class="page">
  <a href="/" class="back-btn">← Back to Home</a>

  <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
  <div th:if="${error}"   class="alert alert-error"   th:text="${error}"></div>

  <div class="tbl-header">
    <div>
      <div class="tbl-title">Physician</div>
      <div class="tbl-sub">Manage and review physician records.</div>
    </div>
    <a href="/physicians/new" class="btn-primary">+ New Physician</a>
  </div>

  <!-- Search bar — submits to server for DB-level search across ALL pages -->
  <form method="get" action="/physicians" class="search-bar-wrap" id="searchForm">
    <div class="search-input-wrap">
      <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input id="searchInput" name="search" type="text" class="search-input" placeholder="Search by name…"
             th:value="${search}" autocomplete="off"/>
      <button type="button" id="clearBtn" class="search-clear"
              th:style="${search != null and !#strings.isEmpty(search)} ? 'display:flex' : 'display:none'"
              onclick="clearSearch()">&#x2715;</button>
    </div>
    <button type="submit" class="btn-primary" style="padding:0.45rem 1.1rem;font-size:0.9rem;">Search</button>
  </form>

  <div class="data-wrap">
    <table>
      <thead>
        <tr>
          <th>EmployeeID</th><th>Name</th><th>Position</th><th>SSN</th>
          <th class="right">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="item : ${page.items}">
          <td th:text="${item['employeeId']}"></td>
          <td>
            <div class="name-cell">
              <div class="avatar-icon-wrap">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none">
                  <circle cx="12" cy="8" r="4" fill="#999"/>
                  <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" stroke="#999" stroke-width="2" stroke-linecap="round" fill="none"/>
                </svg>
              </div>
              <span th:text="${item['name']}"></span>
            </div>
          </td>
          <td th:text="${item['position']}"></td>
          <td th:text="${item['ssn']}"></td>
          <td class="action-cell">
            <div>
              <a class="btn-sm" th:href="@{'/physicians/' + ${item['employeeId']}}">View</a>
              <a class="btn-sm" th:href="@{'/physicians/' + ${item['employeeId']} + '/edit'}">Update</a>

            </div>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(page.items)}" class="empty-row">
          <td colspan="5">No records found.</td>
        </tr>
      </tbody>
    </table>
  </div>
  <!-- Pagination preserves search param -->
  <div class="pagination">
    <a th:if="${!page.first}" class="btn-page"
       th:href="@{/physicians(page=${page.prevPage}, search=${search})}">Previous</a>
    <span th:if="${page.first}" class="btn-page disabled">Previous</span>
    <span class="btn-page info" th:text="'Page ' + (${page.currentPage}+1) + ' / ' + ${page.totalPages}"></span>
    <a th:if="${!page.last}"  class="btn-page"
       th:href="@{/physicians(page=${page.nextPage}, search=${search})}">Next</a>
    <span th:if="${page.last}"  class="btn-page disabled">Next</span>
  </div>
</div>
<script>
function clearSearch() {
  document.getElementById('searchInput').value = '';
  document.getElementById('searchForm').submit();
}
document.getElementById('searchInput').addEventListener('input', function() {
  document.getElementById('clearBtn').style.display = this.value ? 'flex' : 'none';
});
</script>
</body></html>
