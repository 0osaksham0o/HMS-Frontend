<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/><title>Department Form — HospitalDB</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" th:href="@{/css/departments.css}"/>
</head>
<body>
<div class="navbar">
  <a class="navbar-logo" href="/">

    <div class="logo-icon">✚</div>

    <span>MediVeda</span>

  </a>
  <div class="breadcrumb">
    <span class="bc-link"><a href="/departments" style="color:#555;text-decoration:none;">Department</a></span>
    <span class="bc-sep">›</span><span class="bc-cur" th:text="${isNew} ? 'New' : 'Edit'"></span>
  </div>
</div>
<div class="page">
  <a href="/departments" class="back-btn">← Back to Department</a>
  <div class="form-card">
    <div class="form-title" th:text="${isNew} ? 'New Department' : 'Edit Department'"></div>

    <!-- Error alert inside the form card, above the fields -->
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <form th:action="${isNew} ? '/departments' : '/departments/' + ${item['departmentId']} + '/update'" method="post">
      <div class="form-grid">

        <div class="form-group">
          <label>Department ID</label>
          <input type="number" name="departmentId"
                 min="1"
                 th:value="${item['departmentId']}"
                 th:readonly="${!isNew}" required/>
        </div>

        <div class="form-group">
          <label>Head Physician</label>
          <select name="headId" required>
            <option value="">— Select Physician —</option>
            <option th:each="ph : ${physicians}"
                    th:value="${ph['employeeId']}"
                    th:text="${ph['name']} + ' (ID: ' + ${ph['employeeId']} + ')'"
                    th:selected="${item['headId'] != null and item['headId'].toString() == ph['employeeId'].toString()}">
            </option>
          </select>
        </div>

        <div class="form-group full">
          <label>Name</label>
          <input type="text" name="name"
                 pattern="[A-Za-z '.\-]+"
                 title="Only English letters, spaces, hyphens, apostrophes, and periods allowed"
                 th:value="${item['name']}"
                 required/>
        </div>

      </div>
      <div class="form-actions">
        <button type="submit" class="btn-primary"
                th:text="${isNew} ? 'Create Department' : 'Update Department'"></button>
        <a href="/departments" class="btn-cancel">Cancel</a>
      </div>
    </form>
  </div>
</div>
</body></html>
