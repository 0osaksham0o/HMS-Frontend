<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title th:text="'Department — ' + ${item['name']} + ' — HospitalDB'">Department Detail — HospitalDB</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" th:href="@{/css/departments.css}"/>
</head>
<body>


<div class="navbar">
  <a class="navbar-logo" href="/">

    <div class="logo-icon">✚</div>

    <span>MediVeda</span>

  </a>
  <div class="breadcrumb">
    <span class="bc-link"><a href="/departments" style="color:#555;text-decoration:none;">Department</a></span>
    <span class="bc-sep">›</span>
    <span class="bc-cur" th:text="${item['name']}"></span>
  </div>
</div>

<div class="page">

  <a href="/departments" class="back-btn">← Back to Department</a>

  
  <div class="detail-top">
    <div>
      <div class="detail-title" th:text="${item['name']}"></div>
      <div class="detail-sub">Department</div>
    </div>
    <div class="detail-actions">
      <a class="btn-edit" th:href="@{'/departments/' + ${item['departmentId']} + '/edit'}">✎ EDIT</a>
      <form th:action="@{'/departments/' + ${item['departmentId']} + '/delete'}" method="post" style="display:inline">
        <button class="btn-del" onclick="return confirm('Delete this department?')">🗑 DELETE</button>
      </form>
    </div>
  </div>
  <hr class="detail-divider"/>

  
  <div class="detail-section-title"><span>📋</span> Department Details</div>
  <table class="detail-table">
    <tbody>
      <tr>
        <td class="key-cell">DEPARTMENTID</td>
        <td class="val-cell">
          <a class="row-link" th:href="@{'/departments/' + ${item['departmentId']}}"
             th:text="${item['departmentId']}"></a>
        </td>
      </tr>
      <tr>
        <td class="key-cell">NAME</td>
        <td class="val-cell" th:text="${item['name']}"></td>
      </tr>
      <tr>
        <td class="key-cell">HEAD</td>
        <td class="val-cell">
          <th:block th:if="${item['headId'] != null}">
            <a class="row-link"
               th:href="@{'/physicians/' + ${item['headId']}}"
               th:text="${(item['headName'] ?: 'Physician') + ' #' + item['headId'] + ' →'}"></a>
          </th:block>
          <th:block th:unless="${item['headId'] != null}">—</th:block>
        </td>
      </tr>
    </tbody>
  </table>

 
  <div class="rel-section">
    <div class="rel-title">
      🏥 Affiliated Physicians
      <span class="rel-count" th:text="${#lists.size(affiliatedPhysicians)}">0</span>
    </div>
    <div class="data-wrap">
      <table>
        <thead>
          <tr>
            <th>Physician</th>
            <th>Department</th>
            <th>PrimaryAffiliation</th>
          </tr>
        </thead>
        <tbody>
          <tr th:if="${#lists.isEmpty(affiliatedPhysicians)}" class="empty-row">
            <td colspan="3">No affiliated physicians.</td>
          </tr>
          <tr th:each="aff : ${affiliatedPhysicians}"
              class="clickable-row"
              th:onclick="|window.location='/physicians/' + ${aff['physicianEmployeeId']}|">

           
            <td>
              <a class="row-link"
                 th:href="@{'/physicians/' + ${aff['physicianEmployeeId']}}"
                 th:text="${aff['physicianName']}"
                 onclick="event.stopPropagation()"></a>
            </td>

            
            <td th:text="${item['name']}"></td>

           
            <td>
              <span th:if="${aff['primaryAffiliation'] == true}"  class="badge badge-yes">Yes</span>
              <span th:if="${aff['primaryAffiliation'] != true}"  class="badge badge-no">No</span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>
</body>
</html>
