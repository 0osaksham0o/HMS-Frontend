<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title th:text="'Procedure — ' + ${item['name']} + ' — HospitalDB'">Procedure Detail — HospitalDB</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" th:href="@{/css/procedures.css}"/>
</head>
<body>

<!-- Navbar -->
<div class="navbar">
  <a class="navbar-logo" href="/">
    <div class="logo-icon">✚</div>
    <span>MediVeda</span>
  </a>
  <div class="breadcrumb">
    <span class="bc-link"><a href="/procedures" style="color:#555;text-decoration:none;">Procedure</a></span>
    <span class="bc-sep">›</span>
    <span class="bc-cur" th:text="${item['name']}"></span>
  </div>
</div>

<div class="page">

  <!-- Back button -->
  <a href="/procedures" class="back-btn">← Back to Procedure</a>

  <!-- Header: name + EDIT -->
  <div class="detail-top">
    <div>
      <div class="detail-title" th:text="${item['name']}"></div>
      <div class="detail-sub">Procedure</div>
    </div>
    <div class="detail-actions">
      <a class="btn-edit" th:href="@{'/procedures/' + ${item['code']} + '/edit'}">✎ EDIT</a>
    </div>
  </div>

  <hr class="detail-divider"/>

  <!-- ── Procedure Details ── -->
  <div class="detail-section-title"><span>📋</span> Procedure Details</div>
  <table class="detail-table">
    <tbody>
      <tr>
        <td class="key-cell">CODE</td>
        <td class="val-cell" th:text="${item['code']}"></td>
      </tr>
      <tr>
        <td class="key-cell">NAME</td>
        <td class="val-cell" th:text="${item['name']}"></td>
      </tr>
      <tr>
        <td class="key-cell">COST</td>
        <td class="val-cell" th:text="'$' + ${item['cost']}"></td>
      </tr>
    </tbody>
  </table>

  <!-- ── Physicians Certified For This Procedure ── -->
  <div class="rel-section">
    <div class="rel-title">
      👨‍⚕️ Physicians Certified
      <span class="rel-count" th:text="${#lists.size(certifiedPhysicians)}">0</span>
      <span class="rel-hint">— click row to view physician</span>
    </div>

    <div class="data-wrap">
      <table>
        <thead>
          <tr>
            <th>EmployeeID</th>
            <th>PhysicianName</th>
            <th>Position</th>
            <th>CertificationDate</th>
            <th>CertificationExpires</th>
          </tr>
        </thead>
        <tbody>
          <tr th:if="${#lists.isEmpty(certifiedPhysicians)}" class="empty-row">
            <td colspan="5">No physicians certified for this procedure.</td>
          </tr>
          <tr th:each="cp : ${certifiedPhysicians}"
              class="clickable-row"
              th:onclick="|window.location='/physicians/' + ${cp['physicianEmployeeId']}|"
              title="Open Physician">

            <!-- EmployeeID -->
            <td>
              <a class="row-link"
                 th:href="@{'/physicians/' + ${cp['physicianEmployeeId']}}"
                 th:text="${cp['physicianEmployeeId']}"
                 onclick="event.stopPropagation()"></a>
            </td>

            <!-- PhysicianName -->
            <td th:text="${cp['physicianName']}"></td>

            <!-- Position -->
            <td th:text="${cp['physicianPosition']}"></td>

            <!-- CertificationDate — strip time part -->
            <td th:text="${cp['certificationDate'] != null
                          ? #strings.substring(cp['certificationDate'].toString(), 0, 10)
                          : '—'}"></td>

            <!-- CertificationExpires — strip time part -->
            <td th:text="${cp['certificationExpires'] != null
                          ? #strings.substring(cp['certificationExpires'].toString(), 0, 10)
                          : '—'}"></td>

          </tr>
        </tbody>
      </table>
    </div>
  </div><!-- /rel-section -->

</div><!-- /page -->
</body>
</html>
