<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/><title>Procedure Form — HospitalDB</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/procedures.css}"/>
</head>
<body>
<div class="navbar">
  <a class="navbar-logo" href="/">
    <div class="logo-icon">✚</div>
    <span>MediVeda</span>
  </a>
  <div class="breadcrumb">
    <span class="bc-link"><a href="/procedures" style="color:#555;text-decoration:none;">Procedure</a></span>
    <span class="bc-sep">›</span><span class="bc-cur" th:text="${isNew} ? 'New' : 'Edit'"></span>
  </div>
</div>
<div class="page">
  <a href="/procedures" class="back-btn">← Back to Procedure</a>
  <div class="form-card">
    <div class="form-title" th:text="${isNew} ? 'New Procedure' : 'Edit Procedure'"></div>

    <!-- Error alert inside the form card -->
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
    <form th:action="${isNew} ? '/procedures' : '/procedures/' + ${item['code']} + '/update'" method="post">
      <div class="form-grid">
        <div class="form-group"><label>Code</label>
          <input type="number" name="code" th:value="${item['code']}" th:readonly="${!isNew}" required/>
        </div>
        <div class="form-group"><label>Cost ($)</label>
          <input type="number" step="0.01" name="cost" th:value="${item['cost']}" required/>
        </div>
        <div class="form-group full"><label>Name</label>
          <input type="text" name="name" th:value="${item['name']}" required/>
        </div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn-primary" th:text="${isNew} ? 'Create Procedure' : 'Update Procedure'"></button>
        <a href="/procedures" class="btn-cancel">Cancel</a>
      </div>
    </form>
  </div>
</div>
</body></html>
