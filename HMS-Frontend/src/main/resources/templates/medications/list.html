<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/><title>Medication — HospitalDB</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="navbar">
  <a class="navbar-logo" href="/">

    <div class="logo-icon">✚</div>

    <span>MediVeda</span>

  </a>
  <div class="breadcrumb">
    <span class="bc-link"><a href="/" style="color:#555;text-decoration:none;">Home</a></span>
    <span class="bc-sep">›</span><span class="bc-cur">Medication</span>
  </div>
</div>
<div class="page">
  <a href="/" class="back-btn">← Back to Home</a>
  <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
  <div th:if="${error}"   class="alert alert-error"   th:text="${error}"></div>
  <div class="tbl-header">
    <div><div class="tbl-title">Medication</div><div class="tbl-sub">Manage and review medication records.</div></div>
    <a href="/medications/new" class="btn-primary">+ New Medication</a>
  </div>
  <div class="data-wrap">
    <table>
      <thead><tr><th>Code</th><th>Name</th><th>Brand</th><th>Description</th><th class="right">Actions</th></tr></thead>
      <tbody>
        <tr th:each="item : ${page.items}">
          <th:block th:with="mid=${item['code'] != null ? item['code'] : item['_selfId']}">
            <td th:text="${mid}"></td>
            <td th:text="${item['name']}"></td>
            <td th:text="${item['brand']}"></td>
            <td th:text="${item['description']}"></td>
            <td class="action-cell"><div>
              <a class="btn-sm" th:href="@{'/medications/' + ${mid}}">View</a>
              <a class="btn-sm" th:href="@{'/medications/' + ${mid} + '/edit'}">Update</a>
              <form th:action="@{'/medications/' + ${mid} + '/delete'}" method="post" style="display:inline">
                <button class="btn-sm danger" onclick="return confirm('Delete?')">Delete</button>
              </form>
            </div></td>
          </th:block>
        </tr>
        <tr th:if="${#lists.isEmpty(page.items)}" class="empty-row"><td colspan="5">No records found.</td></tr>
      </tbody>
    </table>
  </div>
  <div class="pagination">
    <a th:if="${!page.first}" class="btn-page" th:href="@{/medications(page=${page.prevPage})}">Previous</a>
    <span th:if="${page.first}" class="btn-page disabled">Previous</span>
    <a th:if="${!page.last}"  class="btn-page" th:href="@{/medications(page=${page.nextPage})}">Next</a>
    <span th:if="${page.last}"  class="btn-page disabled">Next</span>
  </div>
</div>
</body></html>
