<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/><title>Medication Form — HospitalDB</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="navbar">
  <a class="navbar-logo" href="/">

    <div class="logo-icon">✚</div>

    <span>MediVeda</span>

  </a>
  <div class="breadcrumb">
    <span class="bc-link"><a href="/medications" style="color:#555;text-decoration:none;">Medication</a></span>
    <span class="bc-sep">›</span><span class="bc-cur" th:text="${isNew} ? 'New' : 'Edit'"></span>
  </div>
</div>
<div class="page">
  <a href="/medications" class="back-btn">← Back to Medication</a>
  <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
  <div class="form-card">
    <div class="form-title" th:text="${isNew} ? 'New Medication' : 'Edit Medication'"></div>
    <form th:action="${isNew} ? '/medications' : '/medications/' + ${item['code']} + '/update'" method="post">
      <div class="form-grid">
        <div class="form-group"><label>Code</label><input type="number" name="code" th:value="${item['code']}" th:readonly="${!isNew}" required/></div>
        <div class="form-group"><label>Brand</label><input type="text" name="brand" th:value="${item['brand']}" required/></div>
        <div class="form-group full"><label>Name</label><input type="text" name="name" th:value="${item['name']}" required/></div>
        <div class="form-group full"><label>Description</label><input type="text" name="description" th:value="${item['description']}"/></div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn-primary" th:text="${isNew} ? 'Create Medication' : 'Update Medication'"></button>
        <a href="/medications" class="btn-cancel">Cancel</a>
      </div>
    </form>
  </div>
</div>
</body></html>
