<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title th:text="'Room ' + ${item['roomNumber']} + ' — HospitalDB'">Room Detail — HospitalDB</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" th:href="@{/css/rooms.css}"/>
</head>
<body>

<!-- Navbar -->
<div class="navbar">
  <a class="navbar-logo" href="/">

    <div class="logo-icon">✚</div>

    <span>MediVeda</span>

  </a>
  <div class="breadcrumb">
    <span class="bc-link"><a href="/rooms" style="color:#555;text-decoration:none;">Room</a></span>
    <span class="bc-sep">›</span>
    <span class="bc-cur" th:text="'Room ' + ${item['roomNumber']}"></span>
  </div>
</div>

<div class="page">

  <a href="/rooms" class="back-btn">← Back to Room</a>

  <!-- Header -->
  <div class="detail-top">
    <div>
      <div class="detail-title" th:text="'Room ' + ${item['roomNumber']}"></div>
      <div class="detail-sub">Room</div>
    </div>
    <div class="detail-actions">
      <a class="btn-edit" th:href="@{'/rooms/' + ${item['roomNumber']} + '/edit'}">✎ EDIT</a>
      <form th:action="@{'/rooms/' + ${item['roomNumber']} + '/delete'}" method="post" style="display:inline">
        <button class="btn-del" onclick="return confirm('Delete this room?')">🗑 DELETE</button>
      </form>
    </div>
  </div>
  <hr class="detail-divider"/>

  <!-- ── Room Details ── -->
  <div class="detail-section-title"><span>📋</span> Room Details</div>
  <table class="detail-table">
    <tbody>
      <tr><td class="key-cell">ROOMNUMBER</td><td class="val-cell" th:text="${item['roomNumber']}"></td></tr>
      <tr><td class="key-cell">ROOMTYPE</td><td class="val-cell" th:text="${item['roomType']}"></td></tr>
      <tr><td class="key-cell">BLOCKFLOOR</td><td class="val-cell" th:text="${item['blockFloor']}"></td></tr>
      <tr><td class="key-cell">BLOCKCODE</td><td class="val-cell" th:text="${item['blockCode']}"></td></tr>
      <tr>
        <td class="key-cell">UNAVAILABLE</td>
        <td class="val-cell">
          <span th:if="${item['unavailable'] == true}"  class="badge badge-no">Yes</span>
          <span th:if="${item['unavailable'] != true}"  class="badge badge-yes">No</span>
        </td>
      </tr>
    </tbody>
  </table>

  <!-- ── Current / Past Occupants (Stays) ── -->
  <div class="rel-section">
    <div class="rel-title">
      🔗 Current / Past Occupants (Stays)
      <span class="rel-count" th:text="${#lists.size(roomStays)}">0</span>
      <span class="rel-hint">— click row to open</span>
    </div>
    <div class="data-wrap">
      <table>
        <thead>
          <tr>
            <th>StayID</th>
            <th>Patient</th>
            <th>Room</th>
            <th>StayStart</th>
            <th>StayEnd</th>
          </tr>
        </thead>
        <tbody>
          <tr th:if="${#lists.isEmpty(roomStays)}" class="empty-row">
            <td colspan="5">No related records.</td>
          </tr>
          <tr th:each="s : ${roomStays}"
              class="clickable-row"
              th:onclick="|window.location='/stays/' + ${s['stayId']}|">

            <!-- StayID -->
            <td>
              <a class="row-link"
                 th:href="@{'/stays/' + ${s['stayId']}}"
                 th:text="${s['stayId']}"
                 onclick="event.stopPropagation()"></a>
            </td>

            <!-- Patient (enriched from controller) -->
            <td>
              <a class="row-link"
                 th:href="@{'/patients/' + ${s['patientSsnResolved']}}"
                 th:text="${s['patientName']}"
                 onclick="event.stopPropagation()"></a>
            </td>

            <!-- Room number -->
            <td th:text="${item['roomNumber']}"></td>

            <!-- StayStart (date only) -->
            <td th:text="${s['stayStart'] != null
                          ? #strings.substring(s['stayStart'].toString(), 0, 10)
                          : '—'}"></td>

            <!-- StayEnd (date only) -->
            <td th:text="${s['stayEnd'] != null
                          ? #strings.substring(s['stayEnd'].toString(), 0, 10)
                          : '—'}"></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div><!-- /page -->
</body>
</html>
