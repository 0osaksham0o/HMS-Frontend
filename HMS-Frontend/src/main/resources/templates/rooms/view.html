<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title th:text="'Room ' + ${item['roomNumber']} + ' — HospitalDB'">Room Detail — HospitalDB</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" th:href="@{/css/rooms.css}"/>
</head>
<body>

<!-- Navbar -->
<div class="navbar">
  <a class="navbar-logo" href="/">

    <div class="logo-icon">✚</div>

    <span>MediVeda</span>

  </a>
  <div class="breadcrumb">
    <span class="bc-link"><a href="/rooms" style="color:#555;text-decoration:none;">Room</a></span>
    <span class="bc-sep">›</span>
    <span class="bc-cur" th:text="'Room ' + ${item['roomNumber']}"></span>
  </div>
</div>

<div class="page">

  <a href="/rooms" class="back-btn">← Back to Room</a>

  <!-- Header -->
  <div class="detail-top">
    <div>
      <div class="detail-title" th:text="'Room ' + ${item['roomNumber']}"></div>
      <div class="detail-sub">Room</div>
    </div>
    <div class="detail-actions">
      <a class="btn-edit" th:href="@{'/rooms/' + ${item['roomNumber']} + '/edit'}">✎ EDIT</a>

    </div>
  </div>
  <hr class="detail-divider"/>

  <!-- ── Room Details ── -->
  <div class="detail-section-title"><span>📋</span> Room Details</div>
  <table class="detail-table">
    <tbody>
      <tr><td class="key-cell">ROOMNUMBER</td><td class="val-cell" th:text="${item['roomNumber']}"></td></tr>
      <tr><td class="key-cell">ROOMTYPE</td><td class="val-cell" th:text="${item['roomType']}"></td></tr>
      <tr><td class="key-cell">BLOCKFLOOR</td><td class="val-cell" th:text="${item['blockFloor']}"></td></tr>
      <tr><td class="key-cell">BLOCKCODE</td><td class="val-cell" th:text="${item['blockCode']}"></td></tr>
      <tr>
        <td class="key-cell">UNAVAILABLE</td>
        <td class="val-cell">
          <span th:if="${item['unavailable'] == true}"  class="badge badge-no">Yes</span>
          <span th:if="${item['unavailable'] != true}"  class="badge badge-yes">No</span>
        </td>
      </tr>
    </tbody>
  </table>

  <!-- ── Booked Appointments ── -->
  <div class="rel-section">
    <div class="rel-title">
      📅 Booked Appointments
      <span class="rel-count" th:text="${#lists.size(roomAppointments)}">0</span>
      <span class="rel-hint">— click row to open</span>
    </div>
    <div class="data-wrap">
      <table>
        <thead>
          <tr>
            <th>Appt ID</th>
            <th>Patient</th>
            <th>Physician</th>
            <th>Start</th>
            <th>End</th>
          </tr>
        </thead>
        <tbody>
          <tr th:if="${#lists.isEmpty(roomAppointments)}" class="empty-row">
            <td colspan="5">No appointments booked in this room.</td>
          </tr>
          <tr th:each="a : ${roomAppointments}"
              class="clickable-row"
              th:onclick="|window.location='/appointments/' + ${a['appointmentId']}|">

            <!-- Appointment ID -->
            <td>
              <a class="row-link"
                 th:href="@{'/appointments/' + ${a['appointmentId']}}"
                 th:text="${a['appointmentId']}"
                 onclick="event.stopPropagation()"></a>
            </td>

            <!-- Patient (enriched from controller) -->
            <td>
              <a class="row-link"
                 th:href="@{'/patients/' + ${a['patientSsnResolved']}}"
                 th:text="${a['patientName']}"
                 onclick="event.stopPropagation()"></a>
            </td>

            <!-- Physician (enriched from controller) -->
            <td>
              <a class="row-link"
                 th:href="@{'/physicians/' + ${a['physicianIdResolved']}}"
                 th:text="${a['physicianName']}"
                 onclick="event.stopPropagation()"></a>
            </td>

            <!-- Start (datetime trimmed to YYYY-MM-DD HH:MM) -->
            <td th:text="${a['start'] != null
                          ? #strings.substring(a['start'].toString(), 0,
                              (#strings.length(a['start'].toString()) > 16 ? 16 : #strings.length(a['start'].toString())))
                          : '—'}"></td>

            <!-- End (datetime trimmed to YYYY-MM-DD HH:MM) -->
            <td th:text="${a['end'] != null
                          ? #strings.substring(a['end'].toString(), 0,
                              (#strings.length(a['end'].toString()) > 16 ? 16 : #strings.length(a['end'].toString())))
                          : '—'}"></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div><!-- /page -->
</body>
</html>
