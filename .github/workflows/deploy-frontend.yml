name: Deploy Frontend

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: HMS-Frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build frontend
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          cat > ~/.ssh/config <<EOF
          Host frontend
            HostName ${{ secrets.EC2_HOST }}
            User ${{ secrets.EC2_USER }}
            IdentityFile ~/.ssh/ec2_key
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF

      - name: Upload jar
        run: |
          scp target/frontend-HMS-0.0.1-SNAPSHOT.jar frontend:/tmp/hospital-frontend.jar

      - name: Restart frontend
        run: |
          ssh frontend << 'EOF'
            sudo mkdir -p /opt/hospital/frontend
            sudo mv /tmp/hospital-frontend.jar /opt/hospital/frontend/app.jar
            sudo chown ubuntu:ubuntu /opt/hospital/frontend/app.jar
            sudo systemctl restart hospital-frontend
            sudo systemctl status hospital-frontend --no-pager
          EOF
